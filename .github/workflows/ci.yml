name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Type check
        run: |
          for p in core css react three r3f; do (cd packages/$p && npx tsc --noEmit -p .); done
      - name: Unit tests
        run: pnpm test
      - name: Build site
        run: pnpm --filter @glassform/site build
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests (Chromium, Firefox, WebKit)
        run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
